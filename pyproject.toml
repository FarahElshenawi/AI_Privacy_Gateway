[project]
name = "ai-privacy-gateway"
version = "0.1.0"
description = "Local PII detection, masking, and restoration service for LLM prompts."
readme = "README.md"
requires-python = ">=3.12"

# Core runtime dependencies (what the backend needs to run)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "faker>=25.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "sqlalchemy>=2.1.2",
]

[project.optional-dependencies]
# Dev/test dependencies
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# Eval dependencies (heavier, only needed for model testing/evaluation)
eval = [
    "onnxruntime>=1.19",
    "gliner2>=2.0.0",
    "torch>=2.5.1",
    "transformers>=5.2",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
