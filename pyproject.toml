[project]
name = "ai-privacy-gateway"
version = "0.1.0"
description = "Local PII detection, masking, and restoration service for LLM prompts."
readme = "README.md"
requires-python = ">=3.12"

# Core runtime dependencies (what the backend needs to run)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "faker>=25.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "cryptography>=42.0",     # vault encryption (was only present through pdfplumber)
    "keyring>=25",            # OS credential store for the vault keys (optional at run time)
    "gliner2>=2.0.0",
    "torch>=2.5.1",
    "transformers>=5.2",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
# Dev/test dependencies
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# Eval dependencies (heavier, only needed for model testing/evaluation)
eval = [
    "onnxruntime>=1.19",
    "gliner2>=2.0.0",
    "torch>=2.5.1",
    "transformers>=5.2",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# This file only pins the developer environment (`uv sync` in local-backend/). The code is not
# packaged as a wheel: it runs from the folder (uvicorn app.main:app) or from installer/.
[tool.uv]
package = false


[tool.ruff]
extend-exclude = ["dashboard", "website", "extension", "eval"]

[tool.ruff.lint]
# Real errors only (syntax, undefined names, unused imports/variables). Style rules are not enforced.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
ignore = ["F401"]   # re-exports in __init__ files; unused imports are cleaned up by hand

[tool.mypy]
ignore_missing_imports = true
exclude = ["/eval/", "/tests/", "test_.*\\.py$"]
