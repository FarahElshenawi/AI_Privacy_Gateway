<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Privacy Gateway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }
    .header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ccc; transition: background 0.3s;
    }
    .status-dot.online { background: #2ecc71; }
    .status-dot.offline { background: #e74c3c; }
    .status-dot.connecting { background: #f39c12; }
    .content { padding: 16px; }
    .status-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px;
    }
    .status-row:last-child { border-bottom: none; }
    .status-label { color: #666; }
    .status-value { font-weight: 600; }
    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #eee;
    }
    .toggle-label { font-size: 14px; font-weight: 600; }
    .toggle {
      position: relative; width: 44px; height: 24px;
      background: #ccc; border-radius: 12px; cursor: pointer;
      transition: background 0.3s;
    }
    .toggle.active { background: #2ecc71; }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; background: #fff; border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle.active::after { transform: translateX(20px); }
    .stats { margin-top: 12px; }
    .stat-box {
      background: #f0f0f0; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; display: flex; justify-content: space-between;
    }
    .stat-label { font-size: 12px; color: #666; }
    .stat-value { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .footer {
      padding: 12px 16px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn {
      background: #1a1a2e; color: #fff; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 12px; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #333; }
    .btn.danger { background: #e74c3c; }
    .btn.danger:hover { background: #c0392b; }
    .hint { font-size: 10px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Privacy Gateway</h1>
    <div class="status-dot connecting" id="statusDot"></div>
  </div>

  <div class="content">
    <div class="toggle-row">
      <span class="toggle-label">Protection Active</span>
      <div class="toggle active" id="toggle"></div>
    </div>

    <div class="status-row">
      <span class="status-label">Backend Status</span>
      <span class="status-value" id="backendStatus">Checking...</span>
    </div>

    <div class="stats">
      <div class="stat-box">
        <span class="stat-label">Prompts masked</span>
        <span class="stat-value" id="promptsMasked">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Entities masked</span>
        <span class="stat-value" id="entitiesMasked">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Files masked</span>
        <span class="stat-value" id="filesMasked">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Fail-closed blocks</span>
        <span class="stat-value" id="blocks">0</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn danger" id="resetToken">Reset Token</button>
    <span class="hint">v0.1.0 — Local only</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
