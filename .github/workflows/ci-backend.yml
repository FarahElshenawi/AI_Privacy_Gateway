name: CI - Backend
on:
  push:
    branches: [develop, main]
    paths: ["local-backend/**", "pyproject.toml", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["local-backend/**", "pyproject.toml", ".github/workflows/ci-backend.yml"]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: local-backend
    env:
      DLP_TIER2_ENABLED: "false"
      DLP_WARM_TIER2: "false"
      DLP_VAULT_PERSIST: "false"
      DLP_KEYSTORE: "file"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt ruff mypy
      - name: Lint (ruff)
        run: ruff check . --config ../pyproject.toml
      - name: Type check (mypy)
        run: mypy app dlp_core --config-file ../pyproject.toml
      - name: Tests
        run: pytest dlp_core/ tests/ -v
