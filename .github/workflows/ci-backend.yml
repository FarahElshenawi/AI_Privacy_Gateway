name: CI - Backend
on:
  push:
    branches: [develop, main]
    paths: ["local-backend/**", "pyproject.toml"]
  pull_request:
    paths: ["local-backend/**", "pyproject.toml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e "../[dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v