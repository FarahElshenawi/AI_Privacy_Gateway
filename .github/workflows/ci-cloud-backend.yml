name: CI - Cloud backend
on:
  push:
    branches: [develop, main]
    paths: ["cloud-backend/**", "pyproject.toml", ".github/workflows/ci-cloud-backend.yml"]
  pull_request:
    paths: ["cloud-backend/**", "pyproject.toml", ".github/workflows/ci-cloud-backend.yml"]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: cloud-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check . --config ../pyproject.toml
      - run: pytest -q

  postgres:
    name: test (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doppel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: cloud-backend
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/doppel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_postgres.py
